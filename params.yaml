preprocess:
  img_size: 96
  train_size: 0.6
  val_size: 0.2
  test_size: 0.2
  seed: 42

train:
  epochs: 7
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  num_workers: 2
  threads: 4
  seed: 42
  data: aug

augment:
  copies: 2
  rotation: 25
  jitter: 0.3
  hue: 0.05
  crop_scale: 0.7
  seed: 42

models:
  resnet18:
    arch: resnet18
    pretrained: true
    freeze_backbone: false
    lr: 0.0003
    epochs: 10
  efficientnet_b0:
    arch: efficientnet_b0
    pretrained: true
    freeze_backbone: false
    lr: 0.0003
    epochs: 10
  simplecnn:
    arch: simplecnn
    pretrained: false
    dropout: 0.3
    lr: 0.001
